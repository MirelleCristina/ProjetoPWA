<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração da profissional Sunny">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e6fb"/>
      <stop offset="100%" stop-color="#e3c9f2"/>
    </linearGradient>
    <linearGradient id="hairS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#caa6e6"/>
      <stop offset="100%" stop-color="#9a5ed0"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgS)"/>
  <!-- back hair bob -->
  <path d="M45 100 C40 60, 70 32, 100 32 C130 32, 160 60, 155 100 C155 130, 150 155, 140 165 C142 130, 138 100, 130 90 C110 105, 90 105, 70 90 C62 100, 58 130, 60 165 C50 155, 45 130, 45 100 Z" fill="url(#hairS)"/>
  <!-- neck -->
  <rect x="86" y="128" width="28" height="24" rx="10" fill="#fffaf3"/>
  <!-- face -->
  <circle cx="100" cy="100" r="52" fill="#fffaf3"/>
  <!-- bangs -->
  <path d="M55 85 C58 55, 80 42, 100 43 C120 42, 142 55, 145 85 C130 70, 115 80, 100 68 C85 80, 70 70, 55 85 Z" fill="url(#hairS)"/>
  <!-- eyebrows -->
  <path d="M78 96 q9 -7 18 -1" fill="none" stroke="#5c2a86" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 95 q9 -6 18 1" fill="none" stroke="#5c2a86" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes -->
  <path d="M80 108 q8 8 16 0" fill="none" stroke="#4a1a70" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 108 q8 8 16 0" fill="none" stroke="#4a1a70" stroke-width="3" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="80" cy="122" r="7" fill="#caa6e6" opacity="0.5"/>
  <circle cx="120" cy="122" r="7" fill="#caa6e6" opacity="0.5"/>
  <!-- smile -->
  <path d="M88 128 q12 12 24 0" fill="none" stroke="#a8579a" stroke-width="3" stroke-linecap="round"/>
  <!-- gold earrings -->
  <circle cx="52" cy="112" r="3.5" fill="#c9a24d"/>
  <circle cx="148" cy="112" r="3.5" fill="#c9a24d"/>
  <!-- badge icon: scissors -->
  <g transform="translate(150,150)">
    <circle r="18" fill="#ffffff" stroke="#c9a24d" stroke-width="2"/>
    <g transform="translate(-6,-6) rotate(30)">
      <circle cx="0" cy="0" r="4" fill="none" stroke="#8a4fc4" stroke-width="2"/>
      <circle cx="0" cy="8" r="4" fill="none" stroke="#8a4fc4" stroke-width="2"/>
      <line x1="3" y1="3" x2="14" y2="-10" stroke="#8a4fc4" stroke-width="2" stroke-linecap="round"/>
      <line x1="3" y1="5" x2="14" y2="16" stroke="#8a4fc4" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
