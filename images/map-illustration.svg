<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa ilustrativo fictício da localização da Carousel Boutique">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e6fb"/>
      <stop offset="100%" stop-color="#e3c9f2"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="28" fill="url(#mapBg)"/>
  <!-- streets -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="120" x2="500" y2="120"/>
    <line x1="0" y1="220" x2="500" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="330" y1="0" x2="330" y2="320"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" stroke-dasharray="2 10" opacity="0.9">
    <line x1="0" y1="120" x2="500" y2="120"/>
    <line x1="0" y1="220" x2="500" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="330" y1="0" x2="330" y2="320"/>
  </g>
  <!-- blocks -->
  <g fill="#ffffff" opacity="0.55">
    <rect x="20" y="20" width="70" height="70" rx="14"/>
    <rect x="160" y="20" width="140" height="70" rx="14"/>
    <rect x="360" y="20" width="110" height="70" rx="14"/>
    <rect x="20" y="150" width="70" height="40" rx="12"/>
    <rect x="360" y="150" width="110" height="40" rx="12"/>
    <rect x="20" y="240" width="70" height="60" rx="14"/>
    <rect x="160" y="240" width="140" height="60" rx="14"/>
    <rect x="360" y="240" width="110" height="60" rx="14"/>
  </g>
  <!-- gold sparkles -->
  <g fill="#c9a24d" opacity="0.8">
    <path d="M60 60 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
    <path d="M420 260 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
  </g>
  <!-- pin -->
  <g transform="translate(215,155)">
    <path d="M0 0 C -34 -34 -34 -80 0 -100 C 34 -80 34 -34 0 0 Z" fill="#7a2fb5" stroke="#c9a24d" stroke-width="3"/>
    <circle cx="0" cy="-70" r="16" fill="#ffffff"/>
    <path d="M0 -76 l4 8 -8 0 z" fill="#7a2fb5"/>
    <circle cx="0" cy="-64" r="3" fill="#7a2fb5"/>
  </g>
  <ellipse cx="215" cy="8" rx="26" ry="7" fill="#4a1a70" opacity="0.25"/>
</svg>
