<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração da profissional Luna">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe0fb"/>
      <stop offset="100%" stop-color="#d6b3ea"/>
    </linearGradient>
    <linearGradient id="hairL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a35ad"/>
      <stop offset="100%" stop-color="#3a1055"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bgL)"/>
  <!-- sleek straight hair -->
  <path d="M42 112 C36 62, 68 30, 100 30 C132 30, 164 62, 158 112 C158 145, 152 172, 144 180 C146 148, 140 118, 134 100 C112 112, 88 112, 66 100 C60 118, 54 148, 56 180 C48 172, 42 145, 42 112 Z" fill="url(#hairL)"/>
  <!-- neck -->
  <rect x="86" y="128" width="28" height="24" rx="10" fill="#fffaf3"/>
  <!-- face -->
  <circle cx="100" cy="100" r="52" fill="#fffaf3"/>
  <!-- sleek bangs -->
  <path d="M54 86 C58 54, 82 40, 100 41 C118 40, 142 54, 146 86 C130 68, 112 78, 100 66 C88 78, 70 68, 54 86 Z" fill="url(#hairL)"/>
  <!-- gold hair clip -->
  <g transform="translate(132,72) rotate(30)">
    <rect x="-8" y="-2" width="16" height="4" rx="2" fill="#c9a24d"/>
    <circle cx="8" cy="0" r="3" fill="#e9cf88"/>
  </g>
  <!-- eyebrows -->
  <path d="M78 96 q9 -7 18 -1" fill="none" stroke="#3a1055" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 95 q9 -6 18 1" fill="none" stroke="#3a1055" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes with elegant liner -->
  <path d="M80 108 q8 8 16 0" fill="none" stroke="#4a1a70" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 108 q8 8 16 0" fill="none" stroke="#4a1a70" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 106 l-2 -5" stroke="#4a1a70" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 106 l2 -5" stroke="#4a1a70" stroke-width="2" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="80" cy="122" r="7" fill="#d6b3ea" opacity="0.6"/>
  <circle cx="120" cy="122" r="7" fill="#d6b3ea" opacity="0.6"/>
  <!-- lips elegant -->
  <path d="M88 128 q12 12 24 0" fill="none" stroke="#8a3a72" stroke-width="3" stroke-linecap="round"/>
  <!-- badge icon: makeup brush -->
  <g transform="translate(150,150)">
    <circle r="18" fill="#ffffff" stroke="#c9a24d" stroke-width="2"/>
    <ellipse cx="0" cy="-8" rx="5" ry="8" fill="#d6b3ea"/>
    <rect x="-2" y="0" width="4" height="14" rx="1" fill="#7a35ad"/>
    <rect x="-2" y="-2" width="4" height="4" fill="#c9a24d"/>
  </g>
</svg>
